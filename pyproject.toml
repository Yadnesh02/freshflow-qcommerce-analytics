[project]
name = "freshflow"
version = "0.1.0"
description = "Perishable inventory, markdown and promotion analytics for q-commerce dark stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # warehouse + transformation
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # data
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "faker>=30.0",
    "python-dateutil>=2.9",
    # modelling
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    # optimisation
    "pulp>=2.9",
    "networkx>=3.3",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "streamlit>=1.39",
    "plotly>=5.24",
    # orchestration
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16.4,<0.17",  # must match the ruff-pre-commit rev in .pre-commit-config.yaml
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=3.2",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "needs_warehouse: requires a built DuckDB warehouse",
]

[tool.coverage.run]
omit = ["tests/*", "*/__init__.py"]
