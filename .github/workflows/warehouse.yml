name: warehouse

# The full-year build, on hardware that can be trusted (task S5.0).
#
# **Why this workflow exists.** On 2026-09-05 `mdsched` confirmed the
# development laptop has faulty non-ECC RAM - events 1102 and 1202. The failure
# that matters was never a crash: one row of `agg_store_sku_day` carried store
# `FF-LPA-00`, a store that does not exist, produced by a single `0x31 -> 0x30`
# bit flip between reading the parquet and writing the table. Row count
# unchanged. Net revenue unchanged. Every total still tied. It was caught by one
# foreign-key test and nothing else.
#
# So the rule for Sprint 5 onward is that any number reaching the README, the
# app or a resume was produced by a workflow file, and this is that file for
# everything derived from the warehouse. Read it as a strengthening of gate G5
# rather than a workaround for broken hardware: a build that runs here, from a
# seed, against the committed lockfile, is one anyone can reproduce from a
# clone. A build that ran on somebody's laptop is a number asking to be trusted.
#
# **Deliberately `workflow_dispatch` only.** It runs ~40 minutes and replaces
# artefacts the live app serves. That should be a decision, not something that
# happens on every push - `ci.yml` already guards correctness on a 30-day slice
# on every commit, which is the fast feedback this is not trying to be.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the live demo slice with this build"
        type: boolean
        default: false

# Publishing needs to write a Release asset and push the manifest that pins it.
# Read-only otherwise; the token is only exposed to the two steps that need it.
permissions:
  contents: write

# Never two of these at once. Not cancel-in-progress: a half-finished publish
# leaves the Release and the manifest disagreeing, which is the exact state that
# breaks the deployed app.
concurrency:
  group: warehouse
  cancel-in-progress: false

jobs:
  build:
    name: build · verify · slice
    runs-on: ubuntu-latest
    # The 20 minutes ci.yml and docs.yml carry is right for a 30-day slice and
    # far too short here: 365 days of simulation plus a full refresh of several
    # multi-million-row window models is ~40 minutes on a 4-core runner.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --all-extras --dev, not requirements.txt. That file is the deployed
      # app's eight runtime packages and deliberately excludes dbt, LightGBM,
      # scipy, statsmodels and PuLP, which are all build-time. Same mistake the
      # stock devcontainer made.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Create local directories
        run: uv run python tasks.py setup

      # Deterministic from the seed. This is the claim gate G5 rests on, so it
      # is worth stating plainly: nothing below reads anything that was not
      # produced by this step, in this job, on this runner.
      #
      # Days and seed are hardcoded rather than dispatch inputs, on purpose.
      # The anchors describe one dataset - 365 days at seed 42 - so a run at any
      # other shape fails all seven by construction and teaches whoever sees it
      # that a red anchor step is normal. That is worth more than the
      # flexibility, and a different dataset is a different workflow. Keeping
      # them literal also keeps tests/test_task_runner.py able to parse this
      # line against the real argparse definition, which a `${{ }}` expression
      # defeats.
      - name: Generate the full-year dataset
        run: uv run python tasks.py simulate --days 365 --seed 42

      # `dbt build` is run *and* test - all 359 of them, including the
      # foreign-key test that caught FF-LPA-00. If the hardware that produced
      # the committed figures had damaged something structural, this step is
      # where it surfaces, and it surfaces before the anchors are consulted.
      - name: Build the warehouse
        run: uv run python tasks.py build --full-refresh

      # Sprint 3's forecast chain, which the first draft of this workflow left
      # out and run #1 failed on: `expiry-risk` needs `mart_demand_forecast`,
      # `forecast` needs `mart_forecast_accuracy`, and only `backtest` produces
      # that. Each module states its own prerequisite in its failure message,
      # which is how the gap was found - but the workflow is where the order
      # actually has to be written down.
      #
      # The step below this pair used to be six, one per decision engine, with a
      # comment saying they would collapse once `t_recommend` worked - it called
      # `analytics.optimization.run_all`, a module nobody ever wrote, behind a
      # `not_yet` guard that tested for a file which exists and so never fired.
      # Fixed at b9a6df2, and collapsed here at the same time, because the
      # duplication was the real cost: the dependency order lived in this file
      # AND in tasks.py, nothing compared them, and `tasks.py recommend` was
      # code no build ever executed.
      #
      # Not `tasks.py all` - that would swallow `simulate` and `build`, which
      # need their own arguments and their own place in the sequence above.
      - name: Backtest the forecast baselines
        run: uv run python tasks.py backtest

      - name: Train the demand forecast
        run: uv run python tasks.py forecast

      # The five Sprint 4 engines, in the dependency order `t_recommend` owns:
      # expiry risk scores the batches everything else reasons about, and
      # elasticity is fitted before the markdown optimiser can read a
      # coefficient. One step rather than six loses nothing in the log - the
      # runner prints each command as it starts it, and the chain stops at the
      # first non-zero exit and returns that engine's code rather than carrying
      # on and building later tables from whatever the previous run left.
      - name: Decision engines
        run: uv run python tasks.py recommend

      # Policy B reads this bundle rather than the rec_* tables (S4.6), and it
      # is committed - which is what lets an experiment job run with no
      # warehouse at all. Regenerated here so the committed copy cannot drift
      # from the parameters this build actually fitted.
      - name: Export the policy bundle
        run: uv run python tasks.py policy-bundle

      # ---------------------------------------------------------------- gate
      # The acceptance gate for S5.0. Seven figures measured on the laptop
      # build; if a clean runner disagrees with any of them, the laptop's build
      # was the wrong one and the documents get corrected - never the anchors.
      #
      # A pass here means "the build reproduced", NOT "the data is clean". The
      # dbt step above is the integrity check; assuming otherwise is precisely
      # the inference that let the phantom store survive a session.
      - name: Anchors
        run: |
          mkdir -p reports
          uv run python tasks.py anchors | tee reports/anchors.txt

      # A report, not a gate - it cannot fail, and it runs after the anchors so
      # a build that disagrees with them still prints the figures somebody has
      # to go and correct. This is the list a documentation pass works from:
      # every quoted number the warehouse can answer for, each with the file
      # that carries the old one. Without it, re-deriving after a change like
      # 04737af means grepping a dozen files for digits and re-running analyses
      # one at a time, which is expensive enough to get deferred - and once
      # deferred, nobody can tell which figures were checked.
      # Tee'd to a file as well as the log. The log needs a browser and a
      # sign-in to read; the file rides along in the build artifact, so the
      # figures can be picked up without anybody transcribing a table.
      - name: Published figures
        run: |
          mkdir -p reports
          uv run python tasks.py published | tee reports/published_figures.txt

      # S5.3's analysis-side sensitivity. It needs no simulation - it recomputes
      # contribution from the warehouse that was just built, at a delivery cost
      # the event stream never carried - so it belongs on the authoritative
      # build rather than in the sweep matrix, which would have implied a
      # compute cost it does not have.
      - name: Delivery-cost crossover
        run: |
          mkdir -p reports
          uv run python tasks.py delivery-sweep | tee reports/delivery_cost.txt

      # The Python contract tests that need a warehouse - the staging contract
      # asserts each injected defect was repaired by the amount dirt.json says
      # was injected, which dbt's own tests cannot check because they only see
      # the output.
      # The operational half of data quality, and it is a gate. dbt's tests ran
      # inside the build above and assert that the transformation is correct;
      # this asserts that the artefact is fit to serve, which is a different
      # question and the only one that still applies to the published demo.
      #
      # Blocking on a FAILURE and not on a warning - `quality/scan.py` maps
      # Soda's exit codes onto that distinction. The clickstream outage warns on
      # every healthy build, and a step that went red for it would be switched
      # off within a week. A feed that stopped arriving stops the build.
      #
      # Soda is not in the lockfile and must not be: it caps protobuf below what
      # dbt-core 1.11 needs, so installing it would downgrade the transformation
      # layer to accommodate the checker. It runs in its own `uv` environment.
      - name: Data-quality scan
        run: |
          mkdir -p reports
          uv run python tasks.py soda | tee reports/soda.txt

      - name: Warehouse contract tests
        run: uv run pytest -m needs_warehouse

      - name: Build the demo slice
        run: uv run python tasks.py demo-slice

      # Always, so a failed run is still inspectable. The policy bundle is here
      # because a change in it is a change in what Policy B does, and that is
      # worth diffing against the committed copy before trusting a result.
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-build
          path: |
            serving/demo/freshflow_demo.duckdb
            simulator/config/policy_bundle.json
            data/_manifest/dirt.json
            reports/
          retention-days: 14
          if-no-files-found: warn

      # ------------------------------------------------------------- publish
      # Only when explicitly asked for, and the two halves move together on
      # purpose. Replacing the Release asset without pushing the manifest that
      # pins its sha256 leaves the deployed container pointed at a file whose
      # hash does not match what it was deployed with, and serving/demo_data.py
      # raises on exactly that - the app survives only while its local cache is
      # warm and fails on the next restart. Splitting these into two steps a
      # human does by hand is how that happened on 2026-09-05.
      - name: Publish the demo slice
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python tasks.py publish-demo

      - name: Commit the manifest that pins it
        if: inputs.publish
        run: |
          set -euo pipefail
          if git diff --quiet -- serving/demo/manifest.json; then
            echo "manifest unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serving/demo/manifest.json
          git commit -m "chore(serving): republish the demo slice from run ${GITHUB_RUN_ID}

          Built by .github/workflows/warehouse.yml on a clean runner, 365 days
          at seed 42, with all seven anchors holding and the dbt suite green.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push origin HEAD:${GITHUB_REF_NAME}
