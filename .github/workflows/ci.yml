name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: 0

jobs:
  quality:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Before the tests, and not optional. `orchestration/definitions.py`
      # builds its dbt assets from transform/target/manifest.json at import
      # time, so without it tests/test_orchestration.py raises during pytest
      # *collection* - and a collection error aborts the entire session rather
      # than failing eight tests. That is precisely how this workflow went red
      # at 3a745da and stayed red for seven commits while warehouse.yml was
      # green: the manifest is a gitignored build artefact, present on the
      # machine that wrote the code and on no clean runner.
      #
      # `parse` writes the manifest without connecting to anything, so it runs
      # here rather than after the dataset exists. The alternative - skipping
      # the orchestration tests when the manifest is absent - would have made
      # CI green by removing the asset graph from it, and a skip that never
      # expires is indistinguishable from a pass.
      - name: Parse the dbt project
        run: uv run python tasks.py parse

      - name: Tests
        run: uv run pytest --cov=analytics --cov=semantic --cov=simulator --cov-report=term-missing

      # the metric dictionary is generated from metrics.yml - fail if the
      # committed copy has drifted from the registry
      - name: Metric dictionary is current
        run: uv run python -m semantic.generate_docs --check

      - name: Lint SQL (sqlfluff)
        working-directory: transform
        run: uv run sqlfluff lint models macros

      - name: Create local directories
        run: uv run python tasks.py setup

      # dbt runs against a 30-day generated slice, not the full 365-day
      # warehouse, so CI stays fast. Once the simulator lands (S1.7) this step
      # produces real data; until then it is a documented no-op.
      - name: Generate CI dataset
        run: uv run python tasks.py simulate --days 30 --seed 1

      - name: dbt build
        run: uv run python tasks.py build --target ci

      # The staging contract runs only once a warehouse exists, so it is skipped
      # by the earlier pytest step and executed here against the CI slice. It
      # asserts each of the eight injected defects was repaired by the amount
      # data/_manifest/dirt.json says was injected - which dbt's own tests, all
      # of which look only at the output, cannot check.
      - name: Warehouse contract tests
        env:
          FRESHFLOW_WAREHOUSE: data/warehouse/freshflow_ci.duckdb
          # the incremental replay test rebuilds a model, so it has to build
          # the same target the assertions read
          FRESHFLOW_DBT_TARGET: ci
        run: uv run pytest -m needs_warehouse
