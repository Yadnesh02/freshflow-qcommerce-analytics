repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=90000"]   # the demo warehouse is the only big file we allow
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Keep this rev in lockstep with the ruff pin in pyproject.toml. If they
  # drift, the hook and CI reformat the same files differently and every
  # commit flip-flops.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
