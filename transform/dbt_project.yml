name: "freshflow"
version: "0.1.0"
config-version: 2

profile: "freshflow"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.8.0", "<2.0.0"]

vars:
  # How far back an incremental run reprocesses. Sized against defect 2: the
  # POS delivers orders up to 48h after they happened, so anything smaller
  # silently drops 23,232 of them and anything larger just costs time.
  # assert_late_arrivals_stay_within_the_lookback fails the build if the feed
  # ever exceeds it.
  late_arrival_lookback_days: 2

  # The trailing average in agg_store_sku_day needs this much history behind
  # the oldest day it reprocesses, or the first days of every incremental run
  # get an average computed from a partial window.
  trailing_window_days: 7

  # Least of a day's demand that must have arrived before a stockout for
  # scaling the observed sales to be worth doing. Below it the estimator is
  # dividing a handful of units by a very small number: cells that ran dry at
  # 01:00 sold 5 units between all 4,233 of them, and scaling those by 147x
  # would manufacture 733 units of demand out of nothing. 0.10 puts the cut at
  # 08:00, where 12.9% of the day has arrived and the multiplier is 7.8x.
  # Thinner cells fall back to the trailing mean, which estimates the day
  # directly instead of extrapolating from an empty morning.
  min_arrival_exposure: 0.10

  # AN ASSUMPTION, NOT A MEASUREMENT. The event stream carries no fulfilment
  # cost - no courier pay, no fuel, no per-drop allocation - and contribution
  # per customer is meaningless without one, because in q-commerce the delivery
  # is the largest variable cost and the customers who look best on GMV are
  # often the ones ordering small baskets most often. Omitting it would not be
  # neutral; it would flatter exactly the cohorts the metric exists to expose.
  # 42 rupees is a plausible Mumbai dark-store figure and is a parameter to be
  # argued with, which is why it is one line here rather than buried in a model.
  # Every number derived from it is sensitive to it in direct proportion.
  assumed_delivery_cost_per_order: 42

  # The clickstream outage of defect 8 removed exactly two partitions. Declaring
  # it here is what lets dq_source_coverage's test pass on the damage we know
  # about and fail the moment a third day goes missing - a tolerance nobody can
  # widen by accident, because widening it means editing this line.
  documented_clickstream_outage_days: 2

  # Replay control: pretend only data that had arrived by this date exists.
  # Null in normal operation. Set it to reproduce a historical run, or to prove
  # the lookback actually catches late arrivals - which is what the S2.6
  # acceptance test does.
  arrival_cutoff_date: null

models:
  freshflow:
    +persist_docs:
      relation: true
      columns: true

    # views: cheap to rebuild, always current, never stored twice
    staging:
      +materialized: view
      +schema: staging

    # ephemeral: inlined as CTEs, so intermediate logic stays readable
    # without littering the warehouse with tables nobody queries
    intermediate:
      +materialized: ephemeral
      +schema: intermediate

    # tables: the marts are read repeatedly by the API and dashboard,
    # so pay the storage and get the scan speed
    marts:
      +materialized: table
      +schema: marts

seeds:
  freshflow:
    +schema: seeds

snapshots:
  freshflow:
    +schema: snapshots
