# Committed deliberately: DuckDB is a local file, so there are no credentials
# here. Anyone who clones the repo can run `dbt build` with no setup at all.
# The moment a real secret is needed it moves to an env var, never to this file.

freshflow:
  target: dev
  outputs:
    # full 14-store, 365-day warehouse - what the experiment runs on
    #
    # The settings block is not tuning for speed, it is what keeps the build
    # survivable on a laptop. Several facts are multi-million-row models with
    # window functions, and dbt runs them concurrently: left to default DuckDB
    # claims most of the machine's RAM across all threads at once and dies with
    # an access violation rather than a clean out-of-memory error, which is a
    # very confusing way to learn you needed a memory limit.
    #
    # preserve_insertion_order=false lets large results stream out instead of
    # being buffered whole - the single biggest saving here, and harmless
    # because every model that cares about order states it in SQL.
    dev:
      type: duckdb
      path: "../data/warehouse/freshflow.duckdb"
      schema: main
      threads: 3
      settings:
        memory_limit: "6GB"
        preserve_insertion_order: false

    # 30-day slice generated fresh on every CI run, so builds stay under a minute
    ci:
      type: duckdb
      path: "../data/warehouse/freshflow_ci.duckdb"
      schema: main
      threads: 2

    # the <80MB marts-only slice that Streamlit Cloud actually deploys (S2.8)
    demo:
      type: duckdb
      path: "../serving/demo/freshflow_demo.duckdb"
      schema: main
      threads: 2
