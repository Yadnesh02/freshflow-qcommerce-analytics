version: 2

models:
  - name: dim_product_snapshot
    description: >
      Type 2 slowly changing dimension on landed cost and base price. One row
      per SKU per period during which neither value changed, so margin on a
      March order can be computed at March's cost instead of being restated
      every time merchandising renegotiates. Intervals are half-open,
      [valid_from_date, valid_to_date), and the newest version of each SKU is
      left open. Derived from the daily catalogue history rather than
      accumulated by `dbt snapshot` - the model header sets out why.
    columns:
      - name: sku_id
        description: "Not unique on its own: a SKU has one row per version."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_catalog__products')
                field: sku_id
      - name: version_no
        description: "1-based, ascending by validity. Version 1 is the SKU's first appearance."
        data_tests:
          - not_null
      - name: dbt_scd_id
        description: >
          Surrogate key, hashed from sku_id and valid_from_date. Named for
          dbt's snapshot convention so a future migration to a real snapshot
          changes nothing downstream.
        data_tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: "Timestamp form of valid_from_date, matching the ERD."
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: "Timestamp form of valid_to_date. Null on the current version."
      - name: valid_from_date
        description: "First day this cost and price were in force. Inclusive."
        data_tests:
          - not_null
      - name: valid_to_date
        description: "First day they were not. Exclusive, and null on the current version."
      - name: is_current
        description: "Exactly one version per SKU is current - asserted by a singular test."
        data_tests:
          - not_null
      - name: days_effective
        description: "How long this version stood. Never zero: a version spans at least one day."
        data_tests:
          - not_null
      - name: landed_cost
        description: "Cost as of this version. The column that makes historical margin correct."
        data_tests:
          - not_null
      - name: base_price
        data_tests:
          - not_null
      - name: landed_cost_delta
        description: "Change from the previous version. Null on version 1 - nothing to change from."

  - name: dim_dte_band
    description: >
      Days-to-expiry buckets used to condition price elasticity and to group the
      expiry action queue. Bounds are lower-inclusive, upper-exclusive.
    columns:
      - name: dte_band
        description: "Bucket label, matching the values declared in semantic/dimensions.yml."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["0-1d", "1-2d", "2-3d", "3-5d", "5-7d", "7d+"]
      - name: min_days
        description: "Lower bound, inclusive."
        data_tests:
          - not_null
      - name: max_days
        description: "Upper bound, exclusive."
        data_tests:
          - not_null
      - name: sort_order
        description: "Display order, ascending by remaining shelf life."
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: >
      The calendar, plus the India-specific flags that explain most of the
      variance in this dataset - salary week, monsoon and the festival cycle.
      Covers the observed window with a month of history and a quarter of
      future either side so forecast horizons have rows to join to.
    columns:
      - name: date_day
        description: "Grain and primary key. One row per calendar day, no gaps."
        data_tests:
          - unique
          - not_null
      - name: week_start_date
        description: "ISO week, Monday-starting."
        data_tests:
          - not_null
      - name: month_start_date
        data_tests:
          - not_null
      - name: day_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
      - name: is_salary_week
        description: "1st-7th. One of the strongest and most under-modelled signals in Indian retail."
        data_tests:
          - not_null
      - name: is_monsoon
        description: "Jun-Sep. Orders rise while fresh supply falls."
        data_tests:
          - not_null
      - name: is_ipl_window
        description: >
          The IPL season, not the fixture list. Which nights had a match is a
          coin flip inside the simulator and cannot be recovered by joining -
          inferring it from the evening demand spike is analysis, not a column.
        data_tests:
          - not_null
      - name: is_festival
        data_tests:
          - not_null
      - name: festival_name
        description: "Null on non-festival days. Earliest-starting festival wins if two overlap."

  - name: dim_store
    description: >
      The 14 dark stores, their catchments and their capacity. Category
      affinity is unpacked to the three perishable categories the expiry
      problem lives in; the full nine-key map stays on stg_ref__stores.
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: store_name
        data_tests:
          - not_null
      - name: locality
        data_tests:
          - not_null
      - name: catchment_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["premium", "mid", "mass"]
      - name: chilled_capacity_share
        description: >
          How much of the store's capacity is refrigerated. Bounds what it can
          hold, and the column whose null exposed the unmerged `defaults` block
          in stores.yaml.
        data_tests:
          - not_null
      - name: serviceable_radius_km
        data_tests:
          - not_null
      - name: frozen_capacity_units
        description: "Counted apart from total capacity: a frozen SKU cannot sit in an ambient bay."
        data_tests:
          - not_null

  - name: dim_product
    description: >
      One row per SKU at current state, taken from its latest catalogue
      snapshot. Historical cost and price live in dim_product_snapshot -
      anything asking "what did this cost in March" reads there.
    columns:
      - name: sku_id
        data_tests:
          - unique
          - not_null
      - name: sku_name
        data_tests:
          - not_null
      - name: l1_category
        data_tests:
          - not_null
      - name: temp_zone
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["frozen", "chilled", "ambient"]
      - name: abc_class
        description: >
          Revenue contribution: A produces the first 80%, B the next 15%, C the
          tail. Inferred from sales, not carried by the catalogue.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["A", "B", "C"]
      - name: xyz_class
        description: >
          Demand predictability by coefficient of variation: X under 0.5, Y
          under 1.0, Z above. Read with abc_class - an AZ SKU is a different
          operational problem from a CX one.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["X", "Y", "Z"]
      - name: has_sales
        description: "False for the 185 SKUs that never sold, which are classified CZ."
        data_tests:
          - not_null
      - name: base_price
        data_tests:
          - not_null

  - name: dim_customer
    description: >
      One row per customer from the latest monthly CRM snapshot. Behavioural
      attributes - RFM, discount dependency, segment - belong to
      mart_customer_360, which reads behaviour rather than the CRM record.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: home_store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: signup_date
        data_tests:
          - not_null
      - name: signup_cohort_month
        description: "Derived once here so two retention charts cannot disagree about a cohort."
        data_tests:
          - not_null
      - name: acquisition_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ["organic", "paid_social", "referral", "app_store"]

  - name: dim_supplier
    description: >
      Suppliers plus an explicit unknown member for SUP-OPENING, the sentinel
      the batch feed uses for day-one stock. Without that row every supplier
      rollup is an inner join that silently drops opening inventory.
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null
      - name: supplier_name
        data_tests:
          - not_null
      - name: is_unknown_member
        description: >
          True only for SUP-OPENING. Lets an analysis exclude it deliberately
          instead of by accident.
        data_tests:
          - not_null
      - name: inbound_freshness_pct_mean
        description: >
          Mean share of shelf life remaining on arrival. Null on the unknown
          member. Read next to the minimum - the mean is what contracts are
          written on, the minimum is what causes the write-off.

  - name: dim_promotion
    description: >
      The promo master. Type and funding source come from a seed because no
      event feed records them; the window and realised depth are observed from
      the price ledger, so a promo configured one way and executed another
      shows up as a gap rather than a margin variance nobody can explain.
    columns:
      - name: promo_id
        data_tests:
          - unique
          - not_null
      - name: promo_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["markdown", "deal_11", "bogo", "bundle", "free_delivery"]
      - name: funding_source
        description: >
          Who absorbs the discount. Only platform-funded subsidy enters
          GM-after-wastage. An assumption, not an observation - see the model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["brand", "platform"]
      - name: observed_depth_pct
        description: "What the ledger actually shows, against the seed's contracted depth."
      - name: was_ever_run
        description: "False for a promo in the master that never appeared in the price ledger."
        data_tests:
          - not_null

seeds:
  - name: dte_bands
    description: "Source lookup for dim_dte_band."
    columns:
      - name: band
        data_tests:
          - unique
          - not_null

  - name: calendar_events
    description: >
      Dated events for dim_date - the festival cycle and the IPL season. Public
      calendar information a retailer would hold, not simulator parameters: it
      deliberately carries no demand multipliers, because inferring those from
      emitted events is the forecasting work in Sprint 3 and reading them here
      would make the result circular. Lunar-calendar dates are approximate.
    columns:
      - name: event_name
        data_tests:
          - unique
          - not_null
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["festival", "sports_season"]
      - name: start_date
        data_tests:
          - not_null
      - name: duration_days
        data_tests:
          - not_null

  - name: promotions
    description: >
      Promo master. The commercial attributes of a promotion - what kind it is
      and who funds it - which no event feed records and a commercial team
      would maintain by hand.
    columns:
      - name: promo_id
        data_tests:
          - unique
          - not_null
      - name: promo_type
        data_tests:
          - not_null
      - name: funding_source
        data_tests:
          - not_null

  - name: mart_customer_360
    description: >
      One row per customer: RFM scores and segment, cohort, discount dependency
      and 90-day contribution. Frequency and monetary are lifetime figures
      rather than 90-day ones, because recency and a 90-day order count are two
      readings of the same window (correlation -0.55) and scoring both from it
      makes the at_risk segment unreachable. delivery_cost_90d is a declared
      assumption from assumed_delivery_cost_per_order, not a measurement, and
      the contribution ranking by DDI band turns on it - see the model header.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: cohort_month
        data_tests:
          - not_null
      - name: customer_segment
        description: "RF grid position, named for the action it implies."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - champion
                  - loyal
                  - promising
                  - at_risk
                  - hibernating
                  - needs_attention
                  - never_ordered
      - name: ddi_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["low", "medium", "high", "no_orders"]
      - name: discount_dependency_index
        description: "Share of trailing-90d orders containing a promotional item."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: r_score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: f_score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: m_score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: orders_90d
        data_tests:
          - not_null
      - name: promo_orders_90d
        data_tests:
          - not_null
      - name: gross_margin_90d
        data_tests:
          - not_null
      - name: delivery_cost_90d
        description: "orders_90d times a declared per-order assumption. Not measured."
        data_tests:
          - not_null
      - name: subsidy_90d
        data_tests:
          - not_null
      - name: active_curr_90d
        data_tests:
          - not_null
      - name: active_prev_90d
        data_tests:
          - not_null
      - name: ordered_m1
        data_tests:
          - not_null

  - name: mart_cohort_retention
    description: >
      Signup cohort by month index: the triangle. Order-based, measured against
      each cohort's full size including members who never ordered, and cut at
      both ends - cohorts predating the order feed are excluded entirely, and no
      row exists past months_observed. Peaks at M1 rather than M0 because
      cohorts key on signup month.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [cohort_month, month_index]
    columns:
      - name: cohort_month
        data_tests:
          - not_null
      - name: month_index
        data_tests:
          - not_null
      - name: cohort_size
        data_tests:
          - not_null
      - name: retention_rate
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_order_daily
    description: >
      Orders per store per day, rolled up from fct_order. The source the aov
      metric has declared since Sprint 2 and did not have until now, which is
      why aov was the one executive metric the resolver gate skipped rather
      than ran. Not derivable from agg_store_sku_day: that table's order_count
      counts orders per SKU, so it triples the denominator and makes AOV read
      Rs 102 against a true Rs 278.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [store_id, date_day]
    columns:
      - name: store_day_key
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: date_day
        data_tests:
          - not_null
      - name: orders_count
        description: >
          Delivered orders - headers with at least one fulfilled line. The aov
          denominator, and deliberately not count(*): 76,121 headers were served
          nothing at all, and including them reads aov as Rs 278.29 against
          Rs 292.56 on delivered orders.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: placed_orders
        description: "Every header, delivered or not. Always >= orders_count."
        data_tests:
          - not_null
      - name: unfulfilled_orders
        description: >
          Headers with a basket and no fulfilled line - a total stockout at pick
          time. Kept visible so an availability collapse shows up here rather
          than as aov drifting for no stated reason.
        data_tests:
          - not_null
      - name: net_revenue
        description: "Net of returns and discounts. Ties to agg_store_sku_day exactly."
        data_tests:
          - not_null
