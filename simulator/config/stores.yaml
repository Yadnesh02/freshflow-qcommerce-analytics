# =============================================================================
# Dark store network - 14 stores across Mumbai
# =============================================================================
# Coordinates are approximate locality centroids, good enough for distance-based
# transfer costs. They are not real store addresses; FreshFlow is fictional.
#
# `demand_index` is the store's share of network demand relative to the mean.
# It encodes catchment population and order density, not store size.
#
# `category_affinity` overrides the network-wide category mix. Powai and Lower
# Parel over-index on ready-to-eat because of the office/IT catchment; Dadar and
# Ghatkopar over-index on staples because of larger resident households. This is
# what makes per-store assortment and markdown decisions differ - without it,
# every store is a scaled copy of every other and the transfer engine has
# nothing to solve.
# =============================================================================

version: 1

defaults:
  serviceable_radius_km: 3.0
  chilled_capacity_units: 2400
  ambient_capacity_units: 9000
  frozen_capacity_units: 900
  daily_operating_hours: [6, 24] # 06:00 to 24:00 IST

