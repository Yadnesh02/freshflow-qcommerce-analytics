# =============================================================================
# Customer segments - the latent behavioural truth
# =============================================================================
# These labels are generator ground truth. Nothing under analytics/ may read
# them; the customer segmentation in mart_customer_360 must be *inferred* from
# order history. The import-boundary test enforces that structurally.
#
# The point of five segments rather than one average customer: a network-level
# elasticity is a weighted average of very different behaviours, and the
# markdown optimiser gets meaningfully better once it conditions on who is
# actually shopping in a given catchment.
# =============================================================================

version: 1

segments:
  - name: price_sensitive
    share: 0.28
    description: >
      Watches price closely, buys staples and value packs, shops the whole
      basket in one weekly trip plus top-ups.
    orders_per_month: [1.0, 3.0]
    basket_items: [3, 8]
    basket_value_index: 0.95
    elasticity_multiplier: 1.45
    private_label_affinity: 1.60
    freshness_sensitivity: 0.85
    delivery_fee_tolerance: 25
    promo_responsiveness: 1.35
    category_bias: { "Staples & Packaged Food": 1.35, "Household & Cleaning": 1.20, "Health & Wellness": 0.70 }

  - name: convenience
    share: 0.30
    description: >
      Buys small and often, because the alternative is walking to a shop. Least
      price-aware segment by volume and the backbone of order frequency.
    orders_per_month: [2.5, 6.0]
    basket_items: [1, 4]
    basket_value_index: 0.62
    elasticity_multiplier: 0.70
    private_label_affinity: 0.95
    freshness_sensitivity: 1.10
    delivery_fee_tolerance: 45
    promo_responsiveness: 0.80
    category_bias: { "Dairy & Eggs": 1.30, "Bakery": 1.25, "Beverages": 1.20, "Staples & Packaged Food": 0.65 }

  - name: premium
    share: 0.14
    description: >
      Brand-led, quality-led, largely indifferent to price. Rejects near-expiry
      stock hardest, which is why deep markdowns do not reach this segment.
    orders_per_month: [1.5, 4.0]
    basket_items: [2, 7]
    basket_value_index: 1.85
    elasticity_multiplier: 0.42
    private_label_affinity: 0.45
    freshness_sensitivity: 1.55
    delivery_fee_tolerance: 90
    promo_responsiveness: 0.45
    category_bias:
      { "Health & Wellness": 1.70, "Ready to Eat & Frozen": 1.40, "Fruits & Vegetables": 1.30,
        "Personal Care": 1.25, "Staples & Packaged Food": 0.70 }

  - name: bulk_planner
    share: 0.16
    description: >
      Large monthly shop, plans ahead, stocks up. Low frequency but high value,
      and the segment most worth protecting from stockouts.
    orders_per_month: [0.8, 2.0]
    basket_items: [6, 16]
    basket_value_index: 2.40
    elasticity_multiplier: 0.95
    private_label_affinity: 1.25
    freshness_sensitivity: 1.20
    delivery_fee_tolerance: 60
    promo_responsiveness: 1.05
    category_bias: { "Staples & Packaged Food": 1.55, "Household & Cleaning": 1.40, "Baby & Pet Care": 1.30 }

  - name: deal_hunter
    share: 0.12
    description: >
      Orders when there is an offer and largely not otherwise. Generates real
      GMV and very little contribution - the segment that makes problem P7
      worth solving, because a naive retention metric counts them as a success.
    orders_per_month: [1.2, 4.0]
    basket_items: [2, 5]
    basket_value_index: 0.70
    elasticity_multiplier: 2.10
    private_label_affinity: 1.30
    freshness_sensitivity: 0.55
    delivery_fee_tolerance: 10
    promo_responsiveness: 2.40
    category_bias: { "Snacks & Namkeen": 1.35, "Beverages": 1.25, "Health & Wellness": 0.60 }

# -----------------------------------------------------------------------------
# Churn hazard
# -----------------------------------------------------------------------------
# Monthly probability of going dormant, and what moves it. This is the
# mechanism that makes better inventory decisions actually *cause* retention -
# without it, any retention lift found in the experiment would be a coincidence
# asserted rather than a result measured.
#
# Multipliers apply per event in the trailing 30 days, compounding.
# -----------------------------------------------------------------------------
churn:
  base_monthly_hazard:
    price_sensitive: 0.075
    convenience: 0.048
    premium: 0.036
    bulk_planner: 0.042
    deal_hunter: 0.155

  # tenure protects: the longer someone has stayed, the likelier they stay
  tenure_decay_per_month: 0.965
  tenure_floor: 0.55

  worsened_by:
    stockout_on_favourite_sku: 1.22 # per occurrence, capped below
    received_low_dte_item: 1.14 # remaining shelf life under 25%
    late_delivery: 1.18
    order_cancelled: 1.45
  max_worsening_multiplier: 2.60

  improved_by:
    successful_deal_redemption: 0.93
    consistent_availability_30d: 0.88 # no stockout on any favourite
  min_improvement_multiplier: 0.70

# -----------------------------------------------------------------------------
# Acquisition - new customers arriving over the simulation window
# -----------------------------------------------------------------------------
acquisition:
  initial_customers: 28000
  monthly_new_customers: [1100, 2200]
  # new stores acquire faster in their first 90 days
  new_store_uplift: 2.10
  channel_mix:
    organic: 0.34
    paid_social: 0.28
    referral: 0.21
    app_store: 0.17

# -----------------------------------------------------------------------------
# Deal rail holdout (task D1)
# -----------------------------------------------------------------------------
# A permanent, customer-level control group that never sees the Rs 11 rail.
#
# The experiment machinery in sprint 5 randomises STORES, which answers "what
# if we rolled this out to half the estate". It cannot answer "who is this
# worth showing to", because every customer in a treated store is treated. An
# uplift model needs a control group at the grain the decision is made at, and
# the decision here is made per customer.
#
# 20% is the usual shape of a growth-team global holdout: large enough that a
# per-decile uplift estimate has customers in every decile, small enough that
# the rail still does its job on the other four fifths. It is deliberately
# PERMANENT rather than re-randomised each day - a customer who dips in and out
# of the control group carries deal exposure from last week into this week's
# counterfactual, and the retention effect this rail is supposed to buy takes
# longer than a day to show up.
deal_holdout:
  share: 0.20

  # Days the rail runs for everyone before the holdout is carved out (D1,
  # amended in D4). Not a detail - it is what makes an uplift model possible.
  #
  # With assignment on day one there is no pre-treatment behaviour anywhere in
  # the warehouse: 25 of mart_customer_360's 31 columns are computed over the
  # treated window, so training on RFM or discount dependency would be fitting
  # on outcomes of the treatment. The model would score beautifully and predict
  # nothing, because it would be reading off who responded rather than who will.
  #
  # So the rail runs for the whole base first and the holdout starts on a date,
  # which is also how a growth team actually introduces one - the deal already
  # exists, and you stop showing it to a slice. Features come from the burn-in,
  # outcomes from after it, and the two never overlap.
  #
  # 45 days matches the pre-period the store-level holdout already uses, for the
  # same reason: a handful of days lets any two groups look alike by accident.
  burn_in_days: 45

  # How much more likely an exposed customer is to order at all on a day their
  # store runs a slot. THIS IS THE GROUND TRUTH D4 HAS TO RECOVER WITHOUT BEING
  # TOLD, which is why it lives here and why `_segment_idx` is stripped before
  # anything is emitted: the uplift model sees RFM, recency and discount
  # dependency, never the segment that generated them.
  #
  # Deliberately heterogeneous, because a uniform response makes uplift
  # modelling pointless - if everyone moves the same amount, targeting the top
  # decile is worth nothing and the whole chapter collapses to an average. The
  # spread below maps onto the four cells the plan names:
  #
  #   deal_hunter, price_sensitive   persuadables - they come for the rail
  #   bulk_planner                   mild; they were coming this week anyway
  #   convenience                    sure things - they order for speed, not price
  #   premium                        sleeping dogs - a rupee rail is not why
  #                                  they are here, and leaning on it slightly
  #                                  cheapens the proposition
  #
  # A value below 1.0 is not a rounding artefact. It is the effect every deal
  # programme claims does not exist and every holdout eventually finds.
  # RECALIBRATED. The first pass used 1.55/1.30/1.10/1.02/0.98, a mean lift of
  # 16.9% on slot days, and the measurement in D2 came back at 25.3x return per
  # rupee of subsidy. That is not a finding, it is this block - and it ruins the
  # project twice over: "does the rail pay" answers trivially yes, and targeting
  # stops mattering because at 25x you show it to everybody.
  #
  # The subsidy is small because the baseline rail is one SKU citywide, about
  # Rs 3 per customer. Getting the return down to 1x from here needs roughly a
  # 25-fold shrink, which drives the order effect to ~0.04 per customer and
  # makes it statistically invisible even over a full year. Marginal economics
  # and a detectable effect are not both reachable while the rail is this small;
  # widening it means changing `deal_slot.slots_per_store`, which is the control
  # arm of the sprint 5 experiment and would invalidate its published table.
  #
  # So this lands at a mean of about 1.026 - a return near 4x. Profitable, not
  # absurd, and still measurable. The story it supports is the honest one: the
  # rail pays, and it pays substantially better once it stops being shown to the
  # 14% of customers it actively puts off.
  response:
    deal_hunter: 1.120
    price_sensitive: 1.055
    bulk_planner: 1.015
    convenience: 1.000
    premium: 0.955
