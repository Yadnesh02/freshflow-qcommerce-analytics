# =============================================================================
# Product catalogue - templates, not 1,500 hand-written rows
# =============================================================================
# The generator expands these subcategory templates into individual SKUs
# deterministically from a seed. Hand-listing 1,500 SKUs would be unmaintainable
# and no more realistic.
#
# What matters analytically:
#   shelf_life_days  - drives the whole expiry problem. Milk at 2-4 days and
#                      masala at 540 are genuinely different businesses.
#   elasticity       - the ground truth the markdown optimiser must *infer*.
#                      Never read directly by anything under analytics/.
#   demand_weight    - category share of network demand, must sum to 1.0
#   hour_curve       - which intraday peak this subcategory rides
#
# Prices are INR. gross_margin_pct is the retailer's margin on base price.
# =============================================================================

version: 1

# SKU popularity within a subcategory follows a Zipf law: a handful of SKUs
# carry most of the volume and a long tail barely moves. This is what makes
# ABC/XYZ classification meaningful and what makes forecasting the tail hard.
popularity:
  distribution: zipf
  alpha: 1.08

private_label:
  brand_name: Nomi
  # private label carries roughly double the margin - the whole commercial
  # reason problem P5 exists
  margin_uplift_pct: 0.11
  price_discount_vs_brand: 0.12

