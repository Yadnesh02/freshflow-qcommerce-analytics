# -----------------------------------------------------------------------------
# Substitution: when a SKU is out of stock, where does its demand go?
# Some shifts within the subcategory, some to private label (which is why
# stockouts are a natural experiment for measuring PL substitution in P5), and
# the rest is genuinely lost. The lost share is what makes availability a
# revenue problem and not just a service metric.
# -----------------------------------------------------------------------------
substitution:
  within_subcategory: 0.45
  to_private_label: 0.15
  lost: 0.40
  # staples substitute readily; fresh and branded snacks much less so
  overrides:
    Staples & Packaged Food: { within_subcategory: 0.62, to_private_label: 0.20, lost: 0.18 }
    Fruits & Vegetables: { within_subcategory: 0.55, to_private_label: 0.05, lost: 0.40 }
    Snacks & Namkeen: { within_subcategory: 0.38, to_private_label: 0.10, lost: 0.52 }
    Dairy & Eggs: { within_subcategory: 0.50, to_private_label: 0.18, lost: 0.32 }

# -----------------------------------------------------------------------------
# Freshness aversion: P(buy) as remaining shelf life runs out, even at a
# discount. This is why a flat "30% off at D-2" ladder fails - the discount that
# clears a 5-day-old yoghurt will not clear a 1-day-old one.
# Keyed by fraction of shelf life remaining.
# -----------------------------------------------------------------------------
freshness_acceptance:
  perishable_threshold_days: 14
  curve:
    1.00: 1.00
    0.60: 0.98
    0.40: 0.93
    0.25: 0.82
    0.15: 0.64
    0.08: 0.41
    0.00: 0.18
